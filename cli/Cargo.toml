[package]
name = "qareel"
description = "Record polished, trustworthy QA demo videos of a web app from any coding agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
test = false

[[bin]]
name = "qareel"
path = "src/main.rs"
test = false

[[bin]]
name = "qareel-fake-host"
path = "src/bin/fake_host.rs"
test = false

[dependencies]
qareel-protocol = { path = "../protocol" }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "fs", "signal"] }
uuid = { version = "1", features = ["v4", "v7"] }
url = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
